name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Check formatting
        shell: bash
        run: |
          python3 -m pip install clang-format==22.1.8
          mapfile -d '' files < <(
            git ls-files -z -- \
              'src/*.cpp' 'src/*.cc' 'src/*.cxx' 'src/*.h' 'src/*.hpp' \
              ':(exclude)src/clientcvar/**' \
              ':(exclude)src/vendor/**'
          )
          clang-format --dry-run --Werror --style=file -- "${files[@]}"
      - name: Check translations
        run: python3 check-translations.py

  windows:
    needs: source
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: CS2AC-1.0.19-source
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build Windows x64 from the source package
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath CS2AC-1.0.19-source.zip -DestinationPath source-check
          Set-Location source-check/CS2AC-1.0.19-source
          ./build-windows.ps1 -BuildDirectory build-windows-ci
      - name: Package Windows x64
        shell: pwsh
        run: python -c "import zipfile; from pathlib import Path; r=Path('source-check/CS2AC-1.0.19-source/build-windows-ci/package'); z=zipfile.ZipFile('CS2AC-1.0.19-windows-x64.zip','w',zipfile.ZIP_DEFLATED); [z.write(p,p.relative_to(r).as_posix()) for p in (r/'game').rglob('*') if p.is_file()]; z.close()"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: CS2AC-1.0.19-windows-x64
          path: CS2AC-1.0.19-windows-x64.zip
          if-no-files-found: error

  linux:
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: CS2AC-1.0.19-source
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build Linux SteamRT3 x64 from the source package
        run: |
          unzip -q CS2AC-1.0.19-source.zip -d source-check
          cd source-check/CS2AC-1.0.19-source
          ./build-linux.sh build-linux-ci
      - name: Package Linux x64
        run: cd source-check/CS2AC-1.0.19-source/build-linux-ci/package && zip -qr ../../../../CS2AC-1.0.19-linux-x64.zip game
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: CS2AC-1.0.19-linux-x64
          path: CS2AC-1.0.19-linux-x64.zip
          if-no-files-found: error

  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Materialize pinned build tools
        run: ./bootstrap.sh
      - name: Package complete source
        run: python3 package-source.py --output CS2AC-1.0.19-source.zip
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: CS2AC-1.0.19-source
          path: CS2AC-1.0.19-source.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, source]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: CS2AC-1.0.19-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "CS2AC ${GITHUB_REF_NAME#v}"
          --notes "CS2AC is free and independently maintained. If it helps your server, please consider supporting the hard work behind CS2 updates, testing, Windows and Linux builds, report investigation, and community support: https://buymeacoffee.com/karola3vax"
          --generate-notes
