// CS2AC loads this file automatically.
// Use 1 to enable a setting and 0 to disable it.

// Master switch. Turning this off stops every detector.
cs2ac_enabled 1

// Whitelisted SteamID64s are still detected and announced, but they are never punished.
// Separate multiple IDs with commas.
// Example: cs2ac_whitelist "76561198000000001,76561198000000002"
cs2ac_whitelist ""

// Detection modules. They are all enabled by default.
cs2ac_aimbot_enabled 1
cs2ac_aimlock_enabled 1
cs2ac_antiaim_enabled 1
cs2ac_autostrafe_enabled 1
cs2ac_bhop_enabled 1
cs2ac_dll_injection_enabled 1
cs2ac_desubticking_enabled 1
cs2ac_doubletap_enabled 1
cs2ac_hyperscroll_enabled 1
cs2ac_inhuman_accuracy_enabled 1
cs2ac_invalid_cvar_enabled 1
cs2ac_invalid_input_enabled 1
cs2ac_irregular_behavior_enabled 1
cs2ac_namechanger_enabled 1
cs2ac_nulls_enabled 1
cs2ac_silentaim_enabled 1
cs2ac_subtick_spam_enabled 1

// Detection announcements.
cs2ac_chat_announcements 1
cs2ac_center_announcements 1

// Commands run after a detection. Leave either value empty to disable that punishment.
// Available placeholders: {steamid64}, {userid}, and {detection}.
cs2ac_punishment_command "css_addban {steamid64} 0 CS2AC: {detection}"
cs2ac_kick_command "css_kick #{userid} CS2AC: {detection}"

// Optional Discord detection reports. The webhook URL is kept out of console output.
cs2ac_webhook_url ""
// Enter a Discord role ID to mention it on every report, or leave this empty.
cs2ac_webhook_role_id ""
// Leave empty to use Steam's public server IP and hostport automatically.
cs2ac_webhook_server_address ""
// Optional public HTTPS logo used for Discord branding and as the avatar fallback.
cs2ac_webhook_logo_url ""

// Diagnostic messages are quiet by default.
cs2ac_aimbot_debug 0
cs2ac_aimlock_debug 0
cs2ac_antiaim_debug 0
cs2ac_autostrafe_debug 0
cs2ac_bhop_debug 0
cs2ac_dll_injection_debug 0
cs2ac_doubletap_debug 0
cs2ac_hyperscroll_debug 0
cs2ac_inhuman_accuracy_debug 0
cs2ac_invalid_cvar_debug 0
cs2ac_irregular_debug 0
cs2ac_namechanger_debug 0
cs2ac_nulls_debug 0
cs2ac_silentaim_debug 0
cs2ac_subtick_debug 0

// Keep this off on public servers. It only exists for local testing with sv_cheats 1.
cs2ac_allow_sv_cheats_testing 0

// ---------------------------------------------------------------------------
// Karasu platform integration
// ---------------------------------------------------------------------------
// KarasuCSAC reports detections to the Karasu CS2 plugin over the server console.
// That plugin owns the match context, the report token and the API credentials, so
// nothing in this file is a secret and this file can be deployed in the clear.
//
// The platform makes the ban decision, not this plugin. What is set here decides
// what happens on THIS server and what the platform is asked to do.

// Send detections to the Karasu plugin. Turning this off makes the anti-cheat
// local-only: it can still remove players, but no ban ever reaches the platform.
cs2ac_karasu_relay 1

// The console command the Karasu CS2 plugin listens on. Only change this if that
// plugin was configured with a different command name.
cs2ac_karasu_relay_command "karasu_anticheat_report"

// What KarasuCSAC does when its policy judges a player a cheater.
//   0  report only - detections are relayed and announced, nobody is removed
//   1  remove the player from this server, but do not ask for an account ban
//   2  remove the player and ask the platform to ban the account
cs2ac_karasu_enforce 2

// How a detected player is removed. kickid is an engine command, so this works
// without any admin plugin installed. Never use a server-local ban command here:
// the platform ban is the real one, and a local ban would only duplicate it.
cs2ac_karasu_kick_command "kickid {userid} Karasu Anti-Cheat"

// THE MAIN DIAL. A detection whose confidence reaches this bans on its own.
//
// Each detector has a fixed confidence reflecting how strong its firing bar is:
//   95 invalid input   93 desubticking, subtick spam   88 aimlock   86 silentaim
//   84 antiaim         82 aimbot        80 nulls, invalid cvar      78 bhop,
//   hyperscroll        76 autostrafe    55 dll injection            50 doubletap
//   45 inhuman accuracy, irregular behavior             30 namechanger
//
// At 55 everything down to and including DLL INJECTION bans on a single detection.
// Set it to 30 and every detector bans on its own. Set it to 76 and only the
// aim/movement/protocol detectors do. Set it to 90 and only the three that are
// structurally impossible for a real client do.
//
// NOTE: DLL INJECTION is the weakest of the ones that ban by default. It fires on
// any ONE of 118 client event subscriptions with no accumulation, and that list
// includes ordinary events like player_jump and door_open, so an overlay or a Valve
// client change can trip it. Raise this above 55 if you see false positives.
cs2ac_karasu_solo_ban_confidence 55

// Confidence a detection must reach before it counts toward corroboration. A
// detection below the solo bar above still bans once a SECOND detector from a
// different family also fires, or once the same detector fires again.
cs2ac_karasu_min_confidence 72

// How long, in seconds, a detection stays eligible to corroborate another one.
// Default is 30 minutes, roughly one match.
cs2ac_karasu_corroboration_window 1800

// Upstream punishment commands are off on a Karasu server: the platform issues the
// ban and cs2ac_karasu_kick_command removes the player. Leaving either of these set
// while cs2ac_karasu_enforce is above 0 would punish the same detection twice.
cs2ac_punishment_command ""
cs2ac_kick_command ""

// Running a surf, KZ or other movement server? The movement detectors assume normal
// competitive movement. Turn them off rather than whitelisting every player:
// cs2ac_bhop_enabled 0
// cs2ac_autostrafe_enabled 0
// cs2ac_hyperscroll_enabled 0
// cs2ac_nulls_enabled 0

// Keep this last so CS2AC can confirm that the whole file was applied.
cs2ac_config_loaded
